; WangertTV IR-Empfänger/-Sender für die ESP32-S3-BOX-3 mit Sensor-Dock
[env:box3]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
; Board-Vorgabe (Hardware-USB-CDC) entfernen: wir brauchen TinyUSB für Tastatur + Seriell
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    z3t0/IRremote@^4.4.1
    lovyan03/LovyanGFX@^1.2.7
