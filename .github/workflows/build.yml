name: WangertTV bauen

# Bauen: von Hand (Actions → Run workflow) oder automatisch, wenn du ein neues Release veröffentlichst
# (Releases → "Draft a new release" → Tag z. B. v1.0.3 → "Publish release").
# Bei einem Release wird das WangertTV-Paket angehängt – die Boxen holen es sich über ihren Updater selbst.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version und Update-Quelle festlegen
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION      # Tag v1.0.3 -> Version 1.0.3
          fi
          # Jede Box, die aus diesem Repository gebaut wird, holt sich ihre Updates automatisch von hier
          sed -i "s|^WTV_REPO=.*|WTV_REPO=${GITHUB_REPOSITORY}|" package/etc/wangerttv/update.conf
          echo "Version: $(cat VERSION) – Update-Quelle: github.com/${GITHUB_REPOSITORY}"

      - name: Tests
        run: |
          python3 -m unittest discover tests
          node tests/check_ui.js

      - name: Paket + ISO bauen
        run: bash build.sh iso

      - name: ISO hochladen (Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: wangerttv-iso
          path: |
            out/*.iso
            out/*.iso.sha256
          compression-level: 0

      - name: Paket hochladen (Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: wangerttv-deb
          path: out/*.deb*

      # Paket an das veröffentlichte Release anhängen – daraus aktualisieren sich die Boxen selbst.
      - name: Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/*.deb.sha256
