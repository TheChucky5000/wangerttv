# WangertTV: HDMI-Ausgang mit IEC958-Steuerung (wie "hdmi:" bei klassischen HDA-Karten).
# Wird für HDMI-Ausgänge mit UCM-Profil (z. B. Intel Tiger Lake "HDMI / DisplayPort 1 Output") genutzt, damit
# PipeWire dort Dolby/DTS bitgenau durchreichen kann. Aufruf: hdmiwtv:CARD=<Karte>,DEV=<PCM-Gerät>,CTL=<HDMI-Nr. - 1>
pcm.hdmiwtv {
	@args [ CARD DEV CTL AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.DEV { type integer }
	@args.CTL { type integer default 0 }
	# consumer, not-copyright, emphasis-none, mode=0
	@args.AES0 { type integer default 0x04 }
	# original, PCM coder
	@args.AES1 { type integer default 0x82 }
	@args.AES2 { type integer default 0x00 }
	# fs=48000Hz
	@args.AES3 { type integer default 0x02 }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device $DEV
	}
	hooks.0 {
		type ctl_elems
		hook_args [
		{
			name "IEC958 Playback Default"
			index $CTL
			lock true
			preserve true
			optional true
			value [ $AES0 $AES1 $AES2 $AES3 ]
		}
		{
			name "IEC958 Playback Switch"
			index $CTL
			optional true
			value true
		}
		]
	}
	hint {
		show off
		description "WangertTV HDMI"
	}
}
