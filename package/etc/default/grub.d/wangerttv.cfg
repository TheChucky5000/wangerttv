# WangertTV: Startmenü unsichtbar (Shift/Esc beim Einschalten zeigt es), Bootanimation statt Text
GRUB_DISTRIBUTOR="WangertTV"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
# i915.fastboot: Bildmodus der Firmware übernehmen (kein Flackern beim Laden des Grafiktreibers)
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=false systemd.show_status=false vt.global_cursor_default=0 i915.fastboot=1 plymouth.ignore-serial-consoles"
# Bildmodus von der Firmware an Linux weitergeben (flackerfreier Start)
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_DISABLE_OS_PROBER=true
