# WangertTV: komprimierter Arbeitsspeicher (zram) als schnelle Auslagerung.
# Chrome, Kodi und Android (Waydroid) gleichzeitig brauchen viel RAM – statt einzufrieren lagert das System
# selten genutzte Speicherseiten komprimiert im RAM aus (zstd, etwa 3:1).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
