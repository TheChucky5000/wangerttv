# WangertTV: Ruhezustand als "Suspend-to-Idle" (s2idle / Modern Standby).
# Dabei bleiben die USB-Anschlüsse aktiv – die Box lässt sich per USB (WangertTV IR / BOX-3) und Bluetooth
# aufwecken, auch wenn das BIOS keine Option "Wake on USB" anbietet. Intel 11. Generation (Geekom IT11)
# unterstützt das; Stromverbrauch im Ruhezustand ca. 1–2 Watt.
[Sleep]
MemorySleepMode=s2idle
