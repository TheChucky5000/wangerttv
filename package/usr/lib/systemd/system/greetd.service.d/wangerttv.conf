# WangertTV: Bei jedem (Neu-)Start von greetd die TV-Oberfläche automatisch starten.
# greetd überspringt die automatische Anmeldung, solange seine "runfile" existiert – daher vorher löschen.
[Unit]
# Standard: nach 5 Fehlversuchen in 30 s aufgeben. Für die TV-Box großzügiger (wtv-guard springt zusätzlich ein).
StartLimitIntervalSec=120
StartLimitBurst=15

[Service]
RestartSec=3
ExecStartPre=-/usr/bin/rm -f /run/greetd-wangerttv.run
