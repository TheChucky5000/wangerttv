# WangertTV Player – Wiedergabe-Kern (mpv/FFmpeg). Startet über wtv/player.py mit --config-dir auf diesen Ordner.

# Bild: Hardware-Dekodierung (Intel VA-API), hochwertige Skalierung, Vollbild unter Wayland
vo=gpu-next
gpu-context=wayland
hwdec=vaapi
# Gute Skalierung, die die Intel-Grafik auch bei 4K/60 flüssig schafft (profile=high-quality wäre dort zu schwer)
scale=spline36
cscale=spline36
dscale=mitchell
deband=yes
# HDR-Filme auf SDR umrechnen (Wayland/Kodi 21: noch keine HDR-Ausgabe)
tone-mapping=bt.2446a
fullscreen=yes
force-window=immediate
keepaspect=yes
video-sync=display-resample
interpolation=no

# Eigene TV-Oberfläche statt der mpv-Bedienleiste
osc=no
osd-bar=no
border=no
input-default-bindings=no
input-builtin-bindings=no
cursor-autohide=1000
osd-font="Inter"
osd-font-size=42
osd-duration=2500

# Ton: PipeWire; Dolby/DTS-Durchreichen setzt WangertTV passend zum Receiver (audio-spdif)
ao=pipewire
audio-file-auto=fuzzy
volume-max=150
alang=de,deu,ger,en,eng
slang=de,deu,ger,en,eng
sub-auto=fuzzy
sub-font="Inter"
sub-font-size=46
sub-border-size=2.5
sub-shadow-offset=1
sub-ass-override=scale

# Fortsetzen, wo man aufgehört hat
save-position-on-quit=yes
resume-playback=yes
watch-later-options=start,aid,sid,sub-delay,audio-delay,speed,video-zoom,video-aspect-override

# Musik: Cover anzeigen; Bilder: Diashow
audio-display=embedded-first
image-display-duration=6
cover-art-auto=fuzzy

# Netzwerk/Streams großzügig puffern
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
network-timeout=30

# Ordner und Blu-ray/DVD-Strukturen als Wiedergabeliste
directory-mode=lazy
