# WangertTV: HDMI-/DisplayPort-Ausgänge dürfen Raumklang unverändert durchreichen (IEC958-Passthrough).
# Kodi schickt dann Dolby Digital, Dolby Digital Plus (inkl. Atmos), DTS, Dolby TrueHD (inkl. Atmos) und
# DTS-HD Master Audio (inkl. DTS:X) bitgenau an AV-Receiver oder Soundbar – aber nur, wenn
# "Raumklang an AV-Receiver durchreichen" in WangertTV eingeschaltet ist. Normaler Ton (PCM) bleibt unverändert.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*[hH][dD][mM][iI].*" }
    ]
    actions = {
      update-props = {
        iec958.codecs = [ PCM AC3 DTS EAC3 TrueHD DTS-HD ]
      }
    }
  }
]
